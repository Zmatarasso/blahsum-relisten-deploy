# Main nginx config used by the audio container. We run worker processes
# as root so they can read audio files regardless of host-side uid/gid
# (the files in BlahNas/Blahsum/shared/* are owned by individual humans,
# not by a service account). The container is read-only against the
# audio dataset and serves on a single non-routable LAN port, so the
# blast radius is bounded.
user root;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
