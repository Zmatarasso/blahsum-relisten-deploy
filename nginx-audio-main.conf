# Main nginx config used by the audio container.
#
# Audio files in BlahNas/Blahsum/shared/* are owned by individual humans
# (uid varies) but with gid 0 and mode 0770 — root group has read access.
# We run nginx workers as the unprivileged `nginx` user, but with gid 0
# so they can read the files. This keeps the standard "workers don't
# run as root" posture: an exploit against nginx lands in a uid 101
# context with read-only access to one bind-mounted directory, not a
# root shell.
user nginx root;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
