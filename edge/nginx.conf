# Public edge for blahsum-relisten. Only two things are reachable:
#   /audio/*  -> static mp3 files (read-only), byte ranges for streaming
#   /*        -> the Next.js web app (GET/HEAD only)
# The .NET API, Hangfire, Swagger, Postgres, Redis, Adminer are NOT routed.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 16k;
  client_body_buffer_size 16k;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  # Everything arrives from the Funnel over one socket, so limits are global
  # (sized for ~10-50 listeners) rather than per-client.
  limit_req_zone  $server_name zone=pages:1m rate=30r/s;
  limit_conn_zone $server_name zone=total:1m;

  map $request_method $bad_method { default 1; GET 0; HEAD 0; }

  server {
    listen unix:/run/edge/edge.sock;
    server_name _;

    if ($bad_method) { return 405; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /audio/ {
      alias /srv/audio/;
      autoindex off;
      limit_conn total 200;
      limit_rate_after 2m;
      limit_rate 2m;              # 16 Mbit/s per stream, plenty for mp3
      expires 30d;
      add_header Accept-Ranges bytes always;
      add_header X-Content-Type-Options nosniff always;
      add_header Access-Control-Allow-Origin * always;
      types { audio/mpeg mp3; audio/flac flac; audio/ogg ogg; audio/mp4 m4a; }
      default_type application/octet-stream;
      location ~ /\. { return 404; }
    }

    location = /healthz { access_log off; return 200 "ok\n"; }

    location / {
      limit_req zone=pages burst=100 nodelay;
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header Connection "";
      proxy_read_timeout 30s;
      # don't let clients poke at Next server actions / RSC internals via body
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }
  }
}
