# blahsum-relisten — hardened stack (Nov 2026)
#
# Public entry: the `edge` nginx listens ONLY on a unix socket that the
# host's Tailscale Funnel proxies to (https://<node>.ts.net:10000).
# No service publishes a host port. Every network is `internal` with no
# bridge IP on the host (inhibit_ipv4) and no IPv6, so containers cannot
# reach the internet, the LAN, or the TrueNAS host (UI/SMB/SSH) at all.
#
#   Funnel ──unix socket──> edge ──app net──> web ──api net──> api ──data net──> db, redis
#                            ├── /audio  (read-only bind of ONE folder)
#                            └── /tracks (read-only: songs cut by importer-watch)
#   importer-watch ──data net──> db, redis  (audio read-only; writes tracks/ + status/)
#
# Secrets live in ./db.env and ./api.env (chmod 600, gitignored, generated
# by ./gen-secrets.sh). See README.

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

networks:
  app:   # edge <-> web
    internal: true
    enable_ipv6: false
    driver_opts: { com.docker.network.bridge.inhibit_ipv4: "true" }
  api:   # web <-> api
    internal: true
    enable_ipv6: false
    driver_opts: { com.docker.network.bridge.inhibit_ipv4: "true" }
  data:  # api/importer/adminer <-> db, redis
    internal: true
    enable_ipv6: false
    driver_opts: { com.docker.network.bridge.inhibit_ipv4: "true" }
  admin: # only used by the on-demand adminer (loopback-published)
    enable_ipv6: false

services:
  redis:
    <<: *hardening
    image: redis:7.4.12-alpine
    user: "999:1000"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--protected-mode", "no"]
    read_only: true
    tmpfs: ["/data"]
    networks: [data]
    mem_limit: 256m

  db:
    <<: *hardening
    image: timescale/timescaledb:2.32.1-pg17
    # postgres entrypoint needs to chown/setuid on start
    cap_add: ["CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE", "FOWNER"]
    command: ["postgres", "-c", "max_locks_per_transaction=5000", "-c", "password_encryption=scram-sha-256"]
    env_file: [db.env]
    environment:
      POSTGRES_USER: relisten
      POSTGRES_DB: relisten_db
      PGDATA: /pgdata
    volumes:
      - ${PG_DATA_DIR:-./data/postgres}:/pgdata
    shm_size: 1g
    networks: [data]
    mem_limit: 2g

  api:
    <<: *hardening
    build: { context: ./RelistenApi }
    image: blahsum-relisten-api:hardened
    depends_on: [db, redis]
    env_file: [api.env]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      REDIS_URL: redis://redis:6379
      PORT: "3823"
      DOTNET_EnableDiagnostics: "0"
      # ENABLE_HANGFIRE_SERVER intentionally unset: no background jobs
    read_only: true
    tmpfs: ["/tmp", "/home/appuser"]
    networks: [api, data]
    mem_limit: 1g

  web:
    <<: *hardening
    build: { context: ./relisten-web }
    image: blahsum-relisten-web:hardened
    depends_on: [api]
    environment:
      RELISTEN_API_URL: http://api:3823
      NEXT_TELEMETRY_DISABLED: "1"
    read_only: true
    tmpfs: ["/tmp", "/app/.next/cache:uid=1001,gid=1001"]
    networks: [app, api]
    mem_limit: 1g

  edge:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.31.7-alpine
    # uid/gid 101 (nginx). Reads the audio share through the NAS
    # `builtin_users` group (gid 545), whose ACL entry grants access to
    # radioTracksStorage. Every mount is read-only except the socket dir.
    user: "101:101"
    group_add: ["545"]
    depends_on: [web]
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx:uid=101,gid=101"]
    volumes:
      - ${AUDIO_DIR:?set AUDIO_DIR}:/srv/audio:ro
      - ${TRACKS_DIR_HOST:?set TRACKS_DIR_HOST}:/srv/tracks:ro
      - ${STATUS_DIR_HOST:?set STATUS_DIR_HOST}:/srv/status:ro
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${EDGE_SOCKET_DIR:?set EDGE_SOCKET_DIR}:/run/edge
    networks: [app]
    mem_limit: 256m

  importer-watch:
    # Auto-import: re-imports within ~5 min whenever a file or a
    # .tracks.txt sidecar in AUDIO_DIR changes. Audio is read-only; it can
    # write only the cut-songs folder and the status folder. data network
    # only (no internet/LAN/host).
    <<: *hardening
    image: blahsum-relisten-importer:hardened
    build: { context: ./importer }
    command: ["watch", "--interval", "300"]
    user: "65534:65534"
    group_add: ["545"]
    depends_on: [db, redis]
    env_file: [api.env]
    environment: &importer_env
      AUDIO_DIR: /audio
      AUDIO_PUBLIC_URL_BASE: ${AUDIO_PUBLIC_URL_BASE:?set AUDIO_PUBLIC_URL_BASE}
      TRACKS_DIR: /tracks
      TRACKS_PUBLIC_URL_BASE: ${TRACKS_PUBLIC_URL_BASE:?set TRACKS_PUBLIC_URL_BASE}
      STATUS_DIR: /status
      REDIS_URL: redis://redis:6379
    read_only: true
    tmpfs: ["/tmp"]
    volumes: &importer_vols
      - ${AUDIO_DIR}:/audio:ro
      - ${TRACKS_DIR_HOST}:/tracks
      - ${STATUS_DIR_HOST}:/status
    networks: [data]
    mem_limit: 512m

  # ---- on-demand tools (never part of `docker compose up -d`) ----

  importer:
    # One-off manual run (importer-watch normally does this automatically):
    #   docker compose --profile tools run --rm importer import
    profiles: ["tools"]
    image: blahsum-relisten-importer:hardened
    build: { context: ./importer }
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    user: "65534:65534"
    group_add: ["545"]
    depends_on: [db]
    env_file: [api.env]
    environment: *importer_env
    read_only: true
    tmpfs: ["/tmp"]
    volumes: *importer_vols
    networks: [data]

  adminer:
    # docker compose --profile tools up -d adminer
    # then from your PC: ssh -L 18080:127.0.0.1:18080 truenas_admin@truenas
    # and open http://localhost:18080  (stop it again when done)
    profiles: ["tools"]
    image: adminer:6.3.1
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on: [db]
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:18080:8080"
    networks: [data, admin]
