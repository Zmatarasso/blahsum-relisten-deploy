server {
    listen 80;
    server_name _;

    # CORS so the web app can stream from a different origin
    add_header Access-Control-Allow-Origin * always;
    add_header Accept-Ranges bytes always;

    location /audio/ {
        autoindex off;
        # Cache audio aggressively — files are content-addressed by path
        expires 30d;
        types {
            audio/mpeg     mp3;
            audio/flac     flac;
            audio/ogg      ogg;
            audio/x-m4a    m4a;
            audio/wav      wav;
        }
    }

    location = /healthz {
        return 200 "ok\n";
    }
}
